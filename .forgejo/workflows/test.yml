# Lint, type check and unit tests. No hardware is involved, so this runs anywhere.
#
# Requires a Forgejo runner registered with a label that provides Docker, named "docker" here. Adjust runs-on to
# match the labels of the runner this repository uses.

name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    runs-on: docker
    container:
      image: python:${{ matrix.python-version }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 --version
          flake8 . --count --statistics

      - name: Type check with mypy
        run: |
          mypy --version
          mypy .

      - name: Unit tests
        run: pytest pycozmo/ -v
