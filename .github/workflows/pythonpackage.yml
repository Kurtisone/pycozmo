# Kept in sync with .forgejo/workflows/test.yml, which is the workflow this fork actually runs.
# This one only matters if the repository is mirrored to GitHub or changes are offered upstream.

name: Python package

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Lint with flake8
      run: |
        flake8 --version
        flake8 . --count --statistics
    - name: Analyze with mypy
      run: |
        mypy --version
        mypy .
      continue-on-error: true
    - name: Test with pytest
      run: |
        pytest pycozmo/tests/
